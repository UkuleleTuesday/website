[build]
  publish = "public"

[dev]
  port = 8888

[[edge_functions]]
  path = "/donate"
  function = "donate"

[[edge_functions]]
  path = "/donate-qr"
  function = "donate"

[[edge_functions]]
  path = "/support-us"
  function = "donate"

[[redirects]]
  from = "https://ukuleletuesday.ie/*"
  to = "https://www.ukuleletuesday.ie/:splat"
  status = 301
  force = true
  headers = { Cache-Control = "public, max-age=31536000" }

# Mixpanel analytics (issue #125). Tracking protection and ad blockers refuse
# Mixpanel's own hosts, so static/js/mixpanel.js loads the SDK and sends events
# through our own origin and Netlify proxies both (status 200 = rewrite), the
# setup Mixpanel documents for proxies.
# The SDK (MIXPANEL_CUSTOM_LIB_URL and lib_base_path in mixpanel.js):
[[redirects]]
  from = "/mp-lib/*"
  to = "https://cdn.mxpnl.com/libs/:splat"
  status = 200
  force = true

# The tracking API (api_host in mixpanel.js; EU data residency):
[[redirects]]
  from = "/mp/*"
  to = "https://api-eu.mixpanel.com/:splat"
  status = 200
  force = true

# --- Headers ---
# HTML: short cache, revalidate in background
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

# CSS/JS: short cache to allow updates (5 minutes + stale-while-revalidate)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# Static assets: moderate cache to avoid stale artifacts
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Edge function endpoints: no caching
[[headers]]
  for = "/donate"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/donate-qr"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/support-us"
  [headers.values]
    Cache-Control = "no-store"
